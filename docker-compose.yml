version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pokemanager_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: pokemanager_app
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    command: sh -c "npx prisma migrate dev --name init && npm run dev"

  adminer:
    image: adminer
    container_name: pokemanager_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: